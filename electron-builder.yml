appId: app.freely.overlay
productName: Freely
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter: ['tray*.png']
asarUnpack: []
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.productivity
  extendInfo:
    NSMicrophoneUsageDescription: Freely listens to your microphone only while Listening is turned on, to transcribe conversations.
    NSScreenCaptureUsageDescription: Freely captures your screen only when you ask it to, to help with what is on it.
    LSUIElement: true
linux:
  target: AppImage
  icon: build/icon.png
  category: Utility
publish: null
